<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>QMB 打卡</title>
<style>
:root{--bg:#eef1ea;--card:#fbfcf8;--tx:#1b2a22;--mu:#5f6f66;--ac:#1f6f4a;--on:#fff;--bd:#cfd8cc;--bad:#a8261c;--ok:#1f6f4a}
@media(prefers-color-scheme:dark){:root{--bg:#0f1511;--card:#18201b;--tx:#e8efe9;--mu:#8fa196;--ac:#4cc08a;--on:#08140d;--bd:#2b362e;--bad:#ff8b80;--ok:#4cc08a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans SC",sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin:0 0 14px}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input[type=email],input[type=password]{width:100%;font:inherit;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:inherit;font-weight:600;border:0;border-radius:12px;padding:14px;width:100%;background:var(--ac);color:var(--on);cursor:pointer}
button:disabled{opacity:.45;cursor:default}
button.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button:focus-visible,input:focus-visible,.pick:focus-within{outline:3px solid var(--ac);outline-offset:2px}
.row{display:flex;gap:10px}
.row>*{flex:1}
.clock{font-size:46px;font-weight:700;letter-spacing:-1px;line-height:1.1}
.pick{display:block;border:2px dashed var(--bd);border-radius:12px;padding:14px;text-align:center;color:var(--mu);cursor:pointer;margin-bottom:12px}
.pick input{display:none}
#prev{display:block;width:100%;max-height:260px;object-fit:cover;border-radius:10px;margin-bottom:12px}
#msg{min-height:24px;margin:10px 0 0;color:var(--mu)}
#msg.bad{color:var(--bad)}
#msg.ok{color:var(--ok)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--bd)}
li:first-child{border-top:0}
li a{color:var(--ac);cursor:pointer;text-decoration:underline}
.err{color:var(--bad);margin:10px 0 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <section id="auth" hidden>
    <h1>QMB 员工打卡</h1>
    <p class="sub">用公司给你的账号登录</p>
    <div class="card">
      <label for="em">邮箱</label>
      <input id="em" type="email" autocomplete="username">
      <label for="pw">密码</label>
      <input id="pw" type="password" autocomplete="current-password">
      <p id="lerr" class="err"></p>
      <button id="loginBtn" style="margin-top:12px">登录</button>
    </div>
  </section>

  <section id="app" hidden>
    <div class="row" style="align-items:flex-start;margin-bottom:16px">
      <div><h1 id="who"></h1><p class="sub" id="date" style="margin:0"></p></div>
      <button class="ghost" id="logout" style="width:auto;flex:none;padding:8px 14px">退出</button>
    </div>
    <div class="card">
      <div class="clock" id="clk">--:--</div>
      <p class="sub" style="margin:4px 0 0">雅加达时间（WIB）</p>
    </div>
    <div class="card">
      <label class="pick" for="file" style="margin-top:0">
        <span id="pickTxt">点此拍自拍照</span>
        <input id="file" type="file" accept="image/*" capture="user">
      </label>
      <img id="prev" alt="自拍预览" hidden>
      <div class="row">
        <button id="bIn">上班打卡</button>
        <button id="bOut">下班打卡</button>
      </div>
      <p id="msg"></p>
    </div>
    <div class="card">
      <strong>今日记录</strong>
      <ul id="list"></ul>
    </div>
    <details class="card">
      <summary>修改密码</summary>
      <label for="np">新密码（至少 6 位）</label>
      <input id="np" type="password" autocomplete="new-password">
      <p id="perr" class="err"></p>
      <button id="pwBtn" style="margin-top:12px">保存新密码</button>
    </details>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const SB_URL = 'https://ifuaodsfyrpsrpyewcwe.supabase.co';
const SB_KEY = 'sb_publishable_Hep4tfjCqwoG_nAM9pllqg_0XVXsLVs';
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = id => document.getElementById(id);
const tz = 'Asia/Jakarta';
const today = () => new Date().toLocaleDateString('en-CA', {timeZone: tz});
const hm = d => new Date(d).toLocaleTimeString('en-GB', {timeZone: tz, hour: '2-digit', minute: '2-digit'});
let me = null, photo = null, busy = false, done = {};

function msg(t, cls) { const e = $('msg'); e.textContent = t || ''; e.className = cls || ''; }

function tick() { $('clk').textContent = new Date().toLocaleTimeString('en-GB', {timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit'}); }
setInterval(tick, 1000); tick();

$('loginBtn').onclick = async () => {
  $('lerr').textContent = '';
  const {error} = await sb.auth.signInWithPassword({email: $('em').value.trim(), password: $('pw').value});
  if (error) { $('lerr').textContent = '登录失败：邮箱或密码不正确'; return; }
  const {error: ce} = await sb.rpc('claim_session');
  if (ce) { $('lerr').textContent = '登录失败：' + ce.message; return; }
  init();
};
$('pw').onkeydown = e => { if (e.key === 'Enter') $('loginBtn').click(); };
async function leave(note) {
  try { await sb.auth.signOut({scope: 'local'}); } catch (e) {}
  me = null; photo = null;
  $('auth').hidden = false; $('app').hidden = true;
  $('lerr').textContent = note || '';
}
$('logout').onclick = () => leave('');

$('pwBtn').onclick = async () => {
  const pw = $('np').value;
  if (pw.length < 6) { $('perr').textContent = '密码至少 6 位'; return; }
  const {error} = await sb.auth.updateUser({password: pw});
  $('perr').style.color = error ? '' : 'var(--ok)';
  $('perr').textContent = error ? '修改失败：' + error.message : '密码已修改';
  if (!error) $('np').value = '';
};

async function stillMine() {
  const {data, error} = await sb.rpc('session_ok');
  if (error) return true;
  if (data === false) { await leave('此账号已在另一台设备登录，请重新登录'); return false; }
  return true;
}
setInterval(() => { if (me && !busy) stillMine(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && me) stillMine(); });

async function init() {
  const {data: {session}} = await sb.auth.getSession();
  $('auth').hidden = !!session;
  $('app').hidden = !session;
  if (!session) return;
  if (!(await stillMine())) return;
  const {data: p} = await sb.from('profiles').select('full_name,role,active').eq('id', session.user.id).maybeSingle();
  if (!p || !p.active) {
    $('who').textContent = '账号未开通';
    msg('此账号没有员工档案或已停用，请联系管理员。', 'bad');
    setBtns(true); return;
  }
  me = {id: session.user.id, ...p};
  $('who').textContent = p.full_name + (p.role === 'admin' ? '（管理员）' : '');
  $('date').textContent = today();
  loadToday();
}

function setBtns(off) {
  $('bIn').disabled = off || !!done.in;
  $('bOut').disabled = off || !!done.out;
  $('bIn').textContent = done.in ? '上班已打卡' : '上班打卡';
  $('bOut').textContent = done.out ? '下班已打卡' : '下班打卡';
}

async function loadToday() {
  if (!me) return;
  const {data: rows, error} = await sb.from('attendance')
    .select('user_id,kind,created_at,distance_m,photo_path')
    .eq('work_date', today()).order('created_at');
  if (error) { msg('读取记录失败：' + error.message, 'bad'); return; }
  const {data: ps} = await sb.from('profiles').select('id,full_name');
  const names = Object.fromEntries((ps || []).map(p => [p.id, p.full_name]));
  done = {};
  rows.filter(r => r.user_id === me.id).forEach(r => done[r.kind] = true);
  setBtns(busy);
  const ul = $('list'); ul.textContent = '';
  if (!rows.length) { const li = document.createElement('li'); li.textContent = '今天还没有打卡记录'; ul.append(li); return; }
  rows.forEach(r => {
    const li = document.createElement('li');
    const l = document.createElement('span');
    l.textContent = (names[r.user_id] || '员工') + ' ' + (r.kind === 'in' ? '上班' : '下班') + ' ' + hm(r.created_at) + '（' + Math.round(r.distance_m) + ' 米）';
    const a = document.createElement('a'); a.textContent = '照片'; a.tabIndex = 0;
    a.onclick = async () => {
      const {data, error} = await sb.storage.from('attendance-selfies').createSignedUrl(r.photo_path, 120);
      if (error) msg('无法打开照片：' + error.message, 'bad'); else window.open(data.signedUrl, '_blank');
    };
    li.append(l, a); ul.append(li);
  });
}

$('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    photo = await shrink(f);
    $('prev').src = URL.createObjectURL(photo); $('prev').hidden = false;
    $('pickTxt').textContent = '重新拍照';
  } catch (err) { msg(err.message, 'bad'); }
};

function shrink(f) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 960 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => b ? res(b) : rej(new Error('照片处理失败')), 'image/jpeg', 0.8);
    };
    img.onerror = () => rej(new Error('无法读取这张照片'));
    img.src = URL.createObjectURL(f);
  });
}

function gps() {
  return new Promise((res, rej) => {
    if (!navigator.geolocation) return rej(new Error('此浏览器不支持定位'));
    navigator.geolocation.getCurrentPosition(p => res(p.coords),
      e => rej(new Error(e.code === 1 ? '请在浏览器设置里允许此网站获取位置' : '无法获取定位，请打开手机 GPS 或到空旷处重试')),
      {enableHighAccuracy: true, timeout: 20000, maximumAge: 0});
  });
}

function friendly(e) {
  const m = (e && e.message) || String(e);
  if (/Session replaced/i.test(m)) { leave('此账号已在另一台设备登录，请重新登录'); return '账号已在另一台设备登录'; }
  if (/duplicate key/i.test(m)) return '今天已经打过这个卡了';
  if (/Outside allowed radius/i.test(m)) return '不在打卡范围内';
  if (/accuracy too low/i.test(m)) return 'GPS 精度不足，请到空旷处重试';
  return m;
}

async function punch(kind) {
  if (busy || !me) return;
  busy = true; setBtns(true);
  try {
    if (!photo) throw new Error('请先拍一张自拍照');
    msg('正在定位…');
    const c = await gps();
    const {data: chk, error: ce} = await sb.rpc('check_location', {p_lat: c.latitude, p_lng: c.longitude, p_accuracy: c.accuracy});
    if (ce) throw ce;
    if (!chk.accuracy_ok) throw new Error('GPS 精度不足（约 ' + Math.round(c.accuracy) + ' 米），请到空旷处重试');
    if (!chk.allowed) throw new Error('不在打卡范围内：距离公司 ' + Math.round(chk.distance_m) + ' 米，允许 ' + chk.radius_m + ' 米内');
    msg('正在上传照片…');
    const path = me.id + '/' + today() + '-' + kind + '-' + Date.now() + '.jpg';
    const {error: ue} = await sb.storage.from('attendance-selfies').upload(path, photo, {contentType: 'image/jpeg'});
    if (ue) throw ue;
    const {error: se} = await sb.rpc('submit_attendance', {p_kind: kind, p_lat: c.latitude, p_lng: c.longitude, p_accuracy: c.accuracy, p_photo_path: path});
    if (se) throw se;
    msg((kind === 'in' ? '上班' : '下班') + '打卡成功，距离公司 ' + Math.round(chk.distance_m) + ' 米', 'ok');
    photo = null; $('prev').hidden = true; $('file').value = ''; $('pickTxt').textContent = '点此拍自拍照';
  } catch (e) {
    msg(friendly(e), 'bad');
  } finally {
    busy = false; await loadToday();
  }
}
$('bIn').onclick = () => punch('in');
$('bOut').onclick = () => punch('out');

init();
</script>
</body>
</html>
